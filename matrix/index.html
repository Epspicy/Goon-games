<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spicy Sequence Matrix - Epspicy Arcade</title>
    <!-- Custom Favicon -->
    <link rel="icon" type="image/png" href="../logo.png">
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 980px;
            margin: 20px auto;
            background: #1a1a24;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            box-sizing: border-box;
            border: 2px solid #2a2a3a;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-link {
            color: #8888a0;
            font-size: 14px;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.2s;
            font-weight: bold;
        }
        .back-link:hover {
            color: #00ffcc;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #121218;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #5865F2;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .user-name {
            font-size: 14px;
            color: #ffffff;
            font-weight: bold;
        }
        .discord-btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            text-decoration: none;
        }
        .discord-btn:hover {
            background-color: #4752C4;
        }
        .header-title {
            color: #00ffcc;
            font-size: 30px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: bold;
        }
        .instruction-banner {
            background: #121218;
            border: 1px solid #ff007f;
            color: #ff007f;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255,0,127,0.2);
        }
        .section-label {
            font-size: 15px;
            color: #00ffcc;
            text-align: left;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .char-card {
            background: #121218;
            border: 2px solid #2a2a3a;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            user-select: none;
        }
        .char-card:hover:not(.used) {
            border-color: #00ffcc;
            transform: translateY(-4px);
            box-shadow: 0 0 15px rgba(0,255,204,0.3);
        }
        .char-card.used {
            opacity: 0.25;
            cursor: not-allowed;
            filter: grayscale(100%);
            border-color: #1a1a24;
        }
        .char-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ffcc;
            margin-bottom: 8px;
            pointer-events: none;
        }
        .char-name {
            font-size: 13px;
            color: #ffffff;
            font-weight: bold;
            pointer-events: none;
        }
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .position-slot {
            background: #121218;
            border: 2px solid #2a2a3a;
            border-radius: 12px;
            padding: 10px 8px;
            transition: all 0.2s;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .position-slot.active {
            border-color: #ff007f;
            background: #251221;
            box-shadow: 0 0 20px rgba(255,0,127,0.6);
            transform: scale(1.03);
        }
        .pos-assigned {
            font-size: 13px;
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 8px;
            min-height: 18px;
            pointer-events: none;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .pos-title-label {
            font-size: 11px;
            color: #8888a0;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .pos-gif {
            width: 105px;
            height: 105px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid #00ffcc;
            pointer-events: none;
        }
        .action-btn {
            background-color: #ff007f;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(255,0,127,0.4);
        }
        .action-btn:hover {
            background-color: #e00070;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .secondary-btn {
            flex: 1;
            background: #2a2a3a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
            transition: all 0.2s;
        }
        .secondary-btn:hover {
            background: #00ffcc;
            color: #0f0f13;
        }
        #results-area {
            margin-top: 30px;
            display: none;
            background: #121218;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
        }
        .stat-row {
            margin-bottom: 15px;
            font-size: 15px;
        }
        .stat-bar-container {
            background: #2a2a3a;
            border-radius: 6px;
            height: 12px;
            width: 100%;
            margin-top: 6px;
            overflow: hidden;
        }
        .stat-bar {
            background: #ff007f;
            height: 100%;
            border-radius: 6px;
            transition: width 0.4s ease;
        }
        .activity-feed {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #2a2a3a;
        }
        .feed-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a24;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #2a2a3a;
            font-size: 14px;
        }
        .feed-user {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            color: #00ffcc;
            font-size: 15px;
            min-width: 160px;
        }
        .feed-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #5865F2;
        }
        .feed-picks {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .mini-pick {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #121218;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #2a2a3a;
        }
        .mini-gif {
            width: 58px;
            height: 58px;
            border-radius: 6px;
            object-fit: cover;
            border: 2px solid #00ffcc;
        }
        .mini-char {
            font-size: 12px;
            color: #ff007f;
            font-weight: bold;
            margin-top: 5px;
        }
        #toast {
            display: none;
            color: #ffcc00;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }
        @media (max-width: 800px) {
            body { padding: 5px; }
            .container { padding: 15px; }
            .roster-grid { grid-template-columns: repeat(3, 1fr); }
            .positions-grid { grid-template-columns: repeat(3, 1fr); }
            .char-img { width: 65px; height: 65px; }
            .pos-gif { width: 75px; height: 75px; }
            .feed-item { flex-direction: column; align-items: flex-start; gap: 12px; }
            .feed-picks { width: 100%; justify-content: space-between; }
            .mini-gif { width: 46px; height: 46px; }
            .mini-char { font-size: 10px; }
        }
    </style>

</head>

    <script>
        if (!window.location.hash.includes('access_token')) {
            if (!window.location.search.includes('session')) {
                const randomSession = Math.floor(1000 + Math.random() * 9000);
                const newUrl = window.location.pathname + '?session=' + randomSession + '&room=matrix-01';
                window.history.replaceState({}, '', newUrl);
            }
        }

        let currentUser = null;

        function loginWithDiscord() {
            const config = window.ARCADE_CONFIG || {};
            const clientId = config.discordClientId || "1560589530136838194";
            const redirectUri = "https://epspicy.github.io/Goon-games/matrix/";
            
            const discordUrl = `https://discord.com/api/oauth2/authorize?client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=identify`;
            window.location.href = discordUrl;
        }

        function checkDiscordAuth() {
            let savedUser = localStorage.getItem('discord_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                renderUserProfile(currentUser);
                return;
            }

            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                window.history.replaceState({}, document.title, window.location.pathname + window.location.search);
                
                fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${accessToken}` }
                })
                .then(res => res.json())
                .then(user => {
                    if (user && user.id) {
                        const userData = {
                            id: user.id,
                            username: user.global_name || user.username,
                            avatar: user.avatar ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png` : 'https://cdn.discordapp.com/embed/avatars/0.png'
                        };
                        localStorage.setItem('discord_user', JSON.stringify(userData));
                        currentUser = userData;
                        renderUserProfile(userData);
                    }
                })
                .catch(err => console.error("Auth Error:", err));
            }
        }

        function renderUserProfile(user) {
            document.getElementById('userProfileArea').innerHTML = `
                <div class="user-profile">
                    <img src="${user.avatar}" class="user-avatar" alt="Avatar">
                    <span class="user-name">${user.username}</span>
                </div>
            `;
