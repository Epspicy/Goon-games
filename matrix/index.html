<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Matrix - Epspicy Arcade</title>
    <!-- Favicon link -->
    <link rel="icon" type="image/png" href="../logo.png">
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 720px;
            margin: 20px auto;
            background: #1a1a24;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-title {
            color: #00ffcc;
            font-size: 22px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .subtitle {
            color: #8888a0;
            font-size: 13px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .back-link {
            display: inline-block;
            color: #8888a0;
            font-size: 12px;
            text-decoration: none;
            margin-bottom: 15px;
            text-transform: uppercase;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #00ffcc;
        }

        /* Characters Roster */
        .section-label {
            font-size: 13px;
            color: #00ffcc;
            text-align: left;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        .char-card {
            background: #121218;
            border: 2px solid #2a2a3a;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            user-select: none;
        }
        .char-card:hover:not(.used) {
            border-color: #ff007f;
            transform: translateY(-3px);
        }
        .char-card.selected {
            border-color: #00ffcc;
            background: #122825;
        }
        .char-card.used {
            opacity: 0.25;
            cursor: not-allowed;
            filter: grayscale(100%);
            border-color: #1a1a24;
        }
        .char-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ffcc;
            margin-bottom: 6px;
            pointer-events: none;
        }
        .char-name {
            font-size: 13px;
            color: #ffffff;
            font-weight: bold;
            pointer-events: none;
        }

        /* Positions Grid (Megalytēra GIFs - 80px) */
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        .position-slot {
            background: #121218;
            border: 2px dashed #44445c;
            border-radius: 10px;
            padding: 12px 6px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .position-slot.active {
            border-color: #ff007f;
            background: #251221;
        }
        .pos-title {
            font-size: 12px;
            color: #8888a0;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            pointer-events: none;
        }
        .pos-assigned {
            font-size: 13px;
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 8px;
            min-height: 18px;
            pointer-events: none;
        }
        .pos-gif {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #00ffcc;
            pointer-events: none;
        }

        /* Buttons */
        .action-btn {
            background-color: #ff007f;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .action-btn:hover {
            background-color: #e00070;
        }
        .action-btn:active {
            transform: scale(0.98);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .secondary-btn {
            flex: 1;
            background: #2a2a3a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            transition: all 0.2s;
        }
        .secondary-btn:hover {
            background: #00ffcc;
            color: #0f0f13;
        }

        /* Results Area */
        #results-area {
            margin-top: 25px;
            display: none;
            background: #121218;
            border: 1px solid #2a2a3a;
            border-radius: 10px;
            padding: 20px;
            text-align: left;
        }
        
        /* Spicy Reaction Photo Style */
        .reaction-photo {
            width: 100%;
            max-width: 320px;
            border-radius: 10px;
            border: 3px solid #ff007f;
            margin: 0 auto 20px auto;
            display: block;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
        }

        .stat-row {
            margin-bottom: 12px;
            font-size: 13px;
        }
        .stat-bar-container {
            background: #2a2a3a;
            border-radius: 4px;
            height: 8px;
            width: 100%;
            margin-top: 4px;
            overflow: hidden;
        }
        .stat-bar {
            background: #ff007f;
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s ease;
        }
        #toast {
            display: none;
            color: #ffcc00;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="../" class="back-link" onclick="playClickSound()">← Back to Arcade</a>
        <div class="header-title">Character Matrix</div>
        <div class="subtitle">Epspicy Mini-Games</div>

        <!-- 1. Characters Roster -->
        <div class="section-label">1. Select Character:</div>
        <div class="roster-grid" id="rosterGrid"></div>

        <!-- 2. Target Positions -->
        <div class="section-label">2. Target Positions (Click slot to assign selected character):</div>
        <div class="positions-grid" id="positionsGrid"></div>

        <!-- Confirm Action Button -->
        <button class="action-btn" onclick="executeSequence()">Launch Sequence & Compare</button>
        
        <!-- Results Area -->
        <div id="results-area">
            <!-- RANDOM SPYCY MODEL REACTION PHOTO/GIF -->
            <img id="reactionImg" src="" class="reaction-photo" alt="Sequence Reaction">

            <div class="section-label" style="margin-bottom: 15px; color: #00ffcc;" id="globalStatsTitle">REAL COMMUNITY STATISTICS:</div>
            
            <div id="stats-list"></div>

            <div class="btn-group">
                <button class="secondary-btn" onclick="shareResults()">Share Results</button>
                <button class="secondary-btn" style="border-color: #ff007f; color: #ff007f;" onclick="resetSelection()">Reset Selection</button>
            </div>
            <div id="toast">Results copied to clipboard!</div>
        </div>
    </div>

    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        // =========================================================
        // ⚙️ CONFIGURATION: PHOTOS / GIFS / REACTION POOL
        // =========================================================
        const CHARACTERS = [
            { name: "Elena",  img: "../PMVheaven THUB.jpg" },
            { name: "Maria",  img: "../PMVheaven THUB.jpg" },
            { name: "Kostas", img: "../PMVheaven THUB.jpg" },
            { name: "Niki",   img: "../PMVheaven THUB.jpg" },
            { name: "Alex",   img: "../PMVheaven THUB.jpg" }
        ];

        const TARGET_GIFS = [
            "../hey-cat.gif",
            "../hug-bros.gif",
            "../man-shaking-head-shakes-head.gif",
            "../aj-brown-drake-maye-aj-brown.gif",
            "../annoyed.gif"
        ];

        // Spicy Model / Scene Reactions Pool gia to end screen
        const REACTION_PHOTOS = [
            "../spicy-model-1.gif",
            "../spicy-model-2.gif",
            "../spicy-model-3.gif"
        ];

        // =========================================================
        // 🔊 MINIMAL SFX SYNTHESIZER (Web Audio API)
        // =========================================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playAssignSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.06);
        }

        function playLaunchSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // =========================================================
        // 🎮 GAME LOGIC & FIREBASE
        // =========================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAyT85gjbKMf0RtttyECLHv2hiv1mREJtU",
            authDomain: "epspicygames.firebaseapp.com",
            databaseURL: "https://epspicygames-default-rtdb.firebaseio.com",
            projectId: "epspicygames",
            storageBucket: "epspicygames.firebasestorage.app",
            messagingSenderId: "813495756093",
            appId: "1:813495756093:web:9d0a93c37c457c653e1154",
            measurementId: "G-WHG3N8WML4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let selectedCharName = null;
        let assignments = { 1: null, 2: null, 3: null, 4: null, 5: null };
        let hasSubmitted = false;
        let allSubmissionsData = null;

        function initUI() {
            const rosterGrid = document.getElementById('rosterGrid');
            rosterGrid.innerHTML = CHARACTERS.map(c => `
                <div class="char-card" id="card-${c.name}" onclick="selectChar('${c.name}')">
                    <img src="${c.img}" class="char-img">
                    <div class="char-name">${c.name}</div>
                </div>
            `).join('');

            const posGrid = document.getElementById('positionsGrid');
            posGrid.innerHTML = TARGET_GIFS.map((gif, idx) => {
                const pos = idx + 1;
                return `
                    <div class="position-slot ${pos === 1 ? 'active' : ''}" id="slot-${pos}" onclick="assignToSlot(${pos})">
                        <div class="pos-title">Pos ${pos}</div>
                        <div class="pos-assigned" id="val-${pos}">-</div>
                        <img src="${gif}" class="pos-gif" alt="GIF ${pos}">
                    </div>
                `;
            }).join('');
        }

        db.ref('submissions').on('value', (snapshot) => {
            allSubmissionsData = snapshot.val();
        });

        function selectChar(charName) {
            playClickSound();
            for (let s = 1; s <= 5; s++) {
                if (assignments[s] === charName) {
                    alert(charName + " is already assigned to Position " + s + "!");
                    return;
                }
            }

            document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
            selectedCharName = charName;
            let card = document.getElementById('card-' + charName);
            if (card) card.classList.add('selected');
        }

        function assignToSlot(slotNum) {
            if (selectedCharName) {
                playAssignSound();
                let oldChar = assignments[slotNum];
                if (oldChar) {
                    let oldCard = document.getElementById('card-' + oldChar);
                    if (oldCard) oldCard.classList.remove('used');
                }

                assignments[slotNum] = selectedCharName;
                document.getElementById('val-' + slotNum).innerText = selectedCharName;

                let charCard = document.getElementById('card-' + selectedCharName);
                if (charCard) {
                    charCard.classList.remove('selected');
                    charCard.classList.add('used');
                }

                selectedCharName = null;

                for (let i = 1; i <= 5; i++) {
                    document.getElementById('slot-' + i).classList.remove('active');
                }
                for (let i = 1; i <= 5; i++) {
                    if (!assignments[i]) {
                        document.getElementById('slot-' + i).classList.add('active');
                        break;
                    }
                }
            } else {
                playClickSound();
                for (let i = 1; i <= 5; i++) {
                    document.getElementById('slot-' + i).classList.remove('active');
                }
                document.getElementById('slot-' + slotNum).classList.add('active');
            }
        }

        async function executeSequence() {
            let filledCount = 0;
            for (let i = 1; i <= 5; i++) {
                if (assignments[i] !== null) filledCount++;
            }

            if (filledCount < 5) {
                playClickSound();
                alert("Please assign characters to all 5 positions before launching!");
                return;
            }

            playLaunchSound();

            // Random Spicy Reaction Image/GIF Pick
            let randomImg = REACTION_PHOTOS[Math.floor(Math.random() * REACTION_PHOTOS.length)];
            document.getElementById("reactionImg").src = randomImg;

            if (!hasSubmitted) {
                hasSubmitted = true;
                await db.ref('submissions').push({
                    assignments: assignments,
                    timestamp: Date.now()
                }).catch(err => console.error("Error:", err));
            }

            let total = 0;
            let counts = { 1: {}, 2: {}, 3: {}, 4: {}, 5: {} };

            if (allSubmissionsData) {
                Object.values(allSubmissionsData).forEach(sub => {
                    if (sub.assignments) {
                        total++;
                        for (let pos = 1; pos <= 5; pos++) {
                            let ch = sub.assignments[pos];
                            if (ch) {
                                counts[pos][ch] = (counts[pos][ch] || 0) + 1;
                            }
                        }
                    }
                });
            }

            document.getElementById("globalStatsTitle").innerText = `REAL COMMUNITY STATISTICS (${total} Total Players):`;

            let statsHtml = "";
            for (let i = 1; i <= 5; i++) {
                let userChosenChar = assignments[i];
                let countForThisChar = counts[i][userChosenChar] || 0;
                let pct = total > 0 ? Math.round((countForThisChar / total) * 100) : 100;

                statsHtml += '<div class="stat-row">' +
                    '<span>Pos ' + i + ': <b>' + userChosenChar + '</b> chosen by <b>' + pct + '%</b> of players (' + countForThisChar + '/' + total + ')</span>' +
                    '<div class="stat-bar-container"><div class="stat-bar" style="width: ' + pct + '%;"></div></div>' +
                    '</div>';
            }

            document.getElementById("stats-list").innerHTML = statsHtml;
            document.getElementById("results-area").style.display = "block";
        }

        function shareResults() {
            playClickSound();
            let text = "My Epspicy Selection Matrix:\n";
            for (let i = 1; i <= 5; i++) {
                text += "Pos " + i + ": " + assignments[i] + "\n";
            }
            text += "Play at: https://epspicy.github.io/Goon-games/matrix/";
            
            navigator.clipboard.writeText(text).then(function() {
                let toast = document.getElementById("toast");
                toast.style.display = "block";
                setTimeout(function() { toast.style.display = "none"; }, 2500);
            });
        }

        function resetSelection() {
            playClickSound();
            assignments = { 1: null, 2: null, 3: null, 4: null, 5: null };
            selectedCharName = null;
            hasSubmitted = false;
            for (let i = 1; i <= 5; i++) {
                document.getElementById('val-' + i).innerText = "-";
            }
            document.querySelectorAll('.char-card').forEach(c => {
                c.classList.remove('used');
                c.classList.remove('selected');
            });
            document.getElementById("results-area").style.display = "none";
            document.querySelectorAll('.position-slot').forEach(s => s.classList.remove('active'));
            document.getElementById('slot-1').classList.add('active');
        }

        initUI();
    </script>

</body>
</html>
