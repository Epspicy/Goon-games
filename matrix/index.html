<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Matrix - Epspicy Arcade</title>
    <!-- Custom Favicon -->
    <link rel="icon" type="image/png" href="../logo.png">
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 950px;
            margin: 20px auto;
            background: #1a1a24;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            box-sizing: border-box;
            border: 2px solid #2a2a3a;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-link {
            color: #8888a0;
            font-size: 13px;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.2s;
            font-weight: bold;
        }
        .back-link:hover {
            color: #00ffcc;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #121218;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #5865F2;
        }
        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        .user-name {
            font-size: 13px;
            color: #ffffff;
            font-weight: bold;
        }
        .header-title {
            color: #00ffcc;
            font-size: 28px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: bold;
        }
        .subtitle {
            color: #8888a0;
            font-size: 14px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .instruction-banner {
            background: #121218;
            border: 1px solid #ff007f;
            color: #ff007f;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255,0,127,0.2);
        }
        .section-label {
            font-size: 14px;
            color: #00ffcc;
            text-align: left;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .char-card {
            background: #121218;
            border: 2px solid #2a2a3a;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            user-select: none;
        }
        .char-card:hover:not(.used) {
            border-color: #00ffcc;
            transform: translateY(-4px);
            box-shadow: 0 0 15px rgba(0,255,204,0.3);
        }
        .char-card.used {
            opacity: 0.25;
            cursor: not-allowed;
            filter: grayscale(100%);
            border-color: #1a1a24;
        }
        .char-img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ffcc;
            margin-bottom: 8px;
            pointer-events: none;
        }
        .char-name {
            font-size: 13px;
            color: #ffffff;
            font-weight: bold;
            pointer-events: none;
        }
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .position-slot {
            background: #121218;
            border: 2px solid #2a2a3a;
            border-radius: 12px;
            padding: 12px 6px;
            transition: all 0.2s;
            user-select: none;
        }
        .position-slot.active {
            border-color: #ff007f;
            background: #251221;
            box-shadow: 0 0 20px rgba(255,0,127,0.6);
            transform: scale(1.03);
        }
        .pos-title {
            font-size: 12px;
            color: #8888a0;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
            pointer-events: none;
        }
        .pos-assigned {
            font-size: 13px;
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 8px;
            min-height: 18px;
            pointer-events: none;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pos-gif {
            width: 85px;
            height: 85px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid #00ffcc;
            pointer-events: none;
        }
        .action-btn {
            background-color: #ff007f;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(255,0,127,0.4);
        }
        .action-btn:hover {
            background-color: #e00070;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .secondary-btn {
            flex: 1;
            background: #2a2a3a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
            transition: all 0.2s;
        }
        .secondary-btn:hover {
            background: #00ffcc;
            color: #0f0f13;
        }
        #results-area {
            margin-top: 30px;
            display: none;
            background: #121218;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
        }
        .reaction-photo {
            width: 100%;
            max-width: 340px;
            border-radius: 12px;
            border: 3px solid #ff007f;
            margin: 0 auto 20px auto;
            display: block;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
        }
        .stat-row {
            margin-bottom: 15px;
            font-size: 14px;
        }
        .stat-bar-container {
            background: #2a2a3a;
            border-radius: 6px;
            height: 10px;
            width: 100%;
            margin-top: 6px;
            overflow: hidden;
        }
        .stat-bar {
            background: #ff007f;
            height: 100%;
            border-radius: 6px;
            transition: width 0.4s ease;
        }

        /* Recent Activity Stream */
        .activity-feed {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #2a2a3a;
        }
        .feed-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a24;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #2a2a3a;
            font-size: 13px;
        }
        .feed-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            color: #00ffcc;
        }
        .feed-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }
        .feed-choices {
            color: #8888a0;
            font-size: 12px;
        }

        #toast {
            display: none;
            color: #ffcc00;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }
        @media (max-width: 800px) {
            body { padding: 5px; }
            .container { padding: 15px; }
            .roster-grid { grid-template-columns: repeat(3, 1fr); }
            .positions-grid { grid-template-columns: repeat(3, 1fr); }
            .char-img { width: 60px; height: 60px; }
            .pos-gif { width: 70px; height: 70px; }
            .feed-item { flex-direction: column; align-items: flex-start; gap: 5px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <a href="../" class="back-link" onclick="playClickSound()">← Back to Arcade</a>
            <div id="userProfileArea"></div>
        </div>

        <div class="header-title">Character Matrix</div>
        <div class="subtitle">Epspicy Mini-Games</div>

        <div class="instruction-banner" id="instructionBanner">Select character for: POSITION 1</div>

        <div class="section-label">Target Positions (Fill in order):</div>
        <div class="positions-grid" id="positionsGrid"></div>

        <div class="section-label">1. Click Character to Assign:</div>
        <div class="roster-grid" id="rosterGrid"></div>

        <button class="action-btn" onclick="executeSequence()">Launch Sequence & Compare</button>
        
        <div id="results-area">
            <img id="reactionImg" src="" class="reaction-photo" alt="Sequence Reaction">
            
            <div class="section-label" style="margin-bottom: 15px; color: #00ffcc;" id="globalStatsTitle">REAL COMMUNITY STATISTICS:</div>
            <div id="stats-list"></div>

            <!-- Recent Discord Players Feed -->
            <div class="activity-feed">
                <div class="section-label" style="color: #ff007f; margin-bottom: 12px;">RECENT DISCORD PLAYERS:</div>
                <div id="recentFeed"></div>
            </div>

            <div class="btn-group">
                <button class="secondary-btn" onclick="shareResults()">Share Results</button>
                <button class="secondary-btn" style="border-color: #ff007f; color: #ff007f;" onclick="resetSelection()">Reset Selection</button>
            </div>
            <div id="toast">Results copied to clipboard!</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        let currentUser = null;

        function checkStoredUser() {
            let savedUser = localStorage.getItem('discord_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                document.getElementById('userProfileArea').innerHTML = `
                    <div class="user-profile">
                        <img src="${currentUser.avatar}" class="user-avatar" alt="Avatar">
                        <span class="user-name">${currentUser.username}</span>
                    </div>
                `;
            }
        }

        const CHARACTERS = [
            { name: "Elena",  img: "../PMVheaven THUB.jpg" },
            { name: "Maria",  img: "../PMVheaven THUB.jpg" },
            { name: "Kostas", img: "../PMVheaven THUB.jpg" },
            { name: "Niki",   img: "../PMVheaven THUB.jpg" },
            { name: "Alex",   img: "../PMVheaven THUB.jpg" },
            { name: "Spiros", img: "../PMVheaven THUB.jpg" }
        ];

        const TARGET_GIFS = [
            "../hey-cat.gif",
            "../hug-bros.gif",
            "../man-shaking-head-shakes-head.gif",
            "../aj-brown-drake-maye-aj-brown.gif",
            "../annoyed.gif",
            "../hey-cat.gif"
        ];

        // Sosta GIFs apo to repository
        const REACTION_PHOTOS = [
            "../hey-cat.gif",
            "../hug-bros.gif",
            "../annoyed.gif"
        ];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playAssignSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.06);
        }

        function playLaunchSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAyT85gjbKMf0RtttyECLHv2hiv1mREJtU",
            authDomain: "epspicygames.firebaseapp.com",
            databaseURL: "https://epspicygames-default-rtdb.firebaseio.com",
            projectId: "epspicygames",
            storageBucket: "epspicygames.firebasestorage.app",
            messagingSenderId: "813495756093",
            appId: "1:813495756093:web:9d0a93c37c457c653e1154",
            measurementId: "G-WHG3N8WML4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let assignments = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null };
        let currentActiveSlot = 1;
        let hasSubmitted = false;
        let allSubmissionsData = null;

        function initUI() {
            checkStoredUser();
            renderRoster();
            renderPositions();
            updateBanner();
        }

        function renderRoster() {
            const rosterGrid = document.getElementById('rosterGrid');
            rosterGrid.innerHTML = CHARACTERS.map(c => {
                let isUsed = Object.values(assignments).includes(c.name);
                return `
                    <div class="char-card ${isUsed ? 'used' : ''}" id="card-${c.name}" onclick="assignCharacter('${c.name}')">
                        <img src="${c.img}" class="char-img">
                        <div class="char-name">${c.name}</div>
                    </div>
                `;
            }).join('');
        }

        function renderPositions() {
            const posGrid = document.getElementById('positionsGrid');
            posGrid.innerHTML = TARGET_GIFS.map((gif, idx) => {
                const pos = idx + 1;
                let isActive = (pos === currentActiveSlot && !assignments[pos]);
                let assignedChar = assignments[pos] || '-';
                return `
                    <div class="position-slot ${isActive ? 'active' : ''}" id="slot-${pos}">
                        <div class="pos-title">Pos ${pos}</div>
                        <div class="pos-assigned" id="val-${pos}">${assignedChar}</div>
                        <img src="${gif}" class="pos-gif" alt="GIF ${pos}">
                    </div>
                `;
            }).join('');
        }

        function updateBanner() {
            let banner = document.getElementById('instructionBanner');
            if (currentActiveSlot <= 6) {
                banner.innerText = `Select character for: POSITION ${currentActiveSlot}`;
                banner.style.color = "#ff007f";
                banner.style.borderColor = "#ff007f";
            } else {
                banner.innerText = `All positions filled! Ready to launch sequence.`;
                banner.style.color = "#00ffcc";
                banner.style.borderColor = "#00ffcc";
            }
        }

        db.ref('submissions').on('value', (snapshot) => {
            allSubmissionsData = snapshot.val();
        });

        function assignCharacter(charName) {
            if (currentActiveSlot > 6) return;
            
            for (let s = 1; s <= 6; s++) {
                if (assignments[s] === charName) return;
            }

            playAssignSound();
            assignments[currentActiveSlot] = charName;

            currentActiveSlot++;
            while (currentActiveSlot <= 6 && assignments[currentActiveSlot] !== null) {
                currentActiveSlot++;
            }

            renderRoster();
            renderPositions();
            updateBanner();
        }

        async function executeSequence() {
            let filledCount = 0;
            for (let i = 1; i <= 6; i++) {
                if (assignments[i] !== null) filledCount++;
            }

            if (filledCount < 6) {
                playClickSound();
                alert("Please assign characters to all 6 positions before launching!");
                return;
            }

            playLaunchSound();

            let randomImg = REACTION_PHOTOS[Math.floor(Math.random() * REACTION_PHOTOS.length)];
            document.getElementById("reactionImg").src = randomImg;

            if (!hasSubmitted) {
                hasSubmitted = true;
                let submissionPayload = {
                    assignments: assignments,
                    timestamp: Date.now(),
                    user: currentUser ? currentUser : { username: "Guest/Anonymous", avatar: "https://cdn.discordapp.com/embed/avatars/0.png" }
                };

                await db.ref('submissions').push(submissionPayload).catch(err => console.error("Error:", err));
            }

            let total = 0;
            let counts = { 1: {}, 2: {}, 3: {}, 4: {}, 5: {}, 6: {} };
            let recentList = [];

            if (allSubmissionsData) {
                let subsArray = Object.values(allSubmissionsData);
                subsArray.forEach(sub => {
                    if (sub.assignments) {
                        total++;
                        for (let pos = 1; pos <= 6; pos++) {
                            let ch = sub.assignments[pos];
                            if (ch) counts[pos][ch] = (counts[pos][ch] || 0) + 1;
                        }
                    }
                });

                // Get last 5 players
                recentList = subsArray.slice(-5).reverse();
            }

            document.getElementById("globalStatsTitle").innerText = `REAL COMMUNITY STATISTICS (${total} Total Players):`;

            let statsHtml = "";
            for (let i = 1; i <= 6; i++) {
                let userChosenChar = assignments[i];
                let countForThisChar = counts[i][userChosenChar] || 0;
                let pct = total > 0 ? Math.round((countForThisChar / total) * 100) : 100;

                statsHtml += '<div class="stat-row">' +
                    '<span>Pos ' + i + ': <b>' + userChosenChar + '</b> chosen by <b>' + pct + '%</b> of players (' + countForThisChar + '/' + total + ')</span>' +
                    '<div class="stat-bar-container"><div class="stat-bar" style="width: ' + pct + '%;"></div></div>' +
                    '</div>';
            }

            document.getElementById("stats-list").innerHTML = statsHtml;

            // Render Recent Players Feed
            let feedHtml = "";
            recentList.forEach(item => {
                let username = item.user ? item.user.username : "Guest";
                let avatar = item.user ? item.user.avatar : "https://cdn.discordapp.com/embed/avatars/0.png";
                let seq = item.assignments ? Object.values(item.assignments).join(', ') : '';

                feedHtml += `
                    <div class="feed-item">
                        <div class="feed-user">
                            <img src="${avatar}" class="feed-avatar">
                            <span>${username}</span>
                        </div>
                        <div class="feed-choices">Picks: ${seq}</div>
                    </div>
                `;
            });

            document.getElementById("recentFeed").innerHTML = feedHtml;
            document.getElementById("results-area").style.display = "block";
        }

        function shareResults() {
            playClickSound();
            let playerGreeting = currentUser ? `Player: ${currentUser.username}\n` : "";
            let text = `${playerGreeting}My Epspicy Selection Matrix:\n`;
            for (let i = 1; i <= 6; i++) {
                text += "Pos " + i + ": " + assignments[i] + "\n";
            }
            text += "Play at: https://epspicy.github.io/Goon-games/matrix/";
            
            navigator.clipboard.writeText(text).then(function() {
                let toast = document.getElementById("toast");
                toast.style.display = "block";
                setTimeout(function() { toast.style.display = "none"; }, 2500);
            });
        }

        function resetSelection() {
            playClickSound();
            assignments = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null };
            currentActiveSlot = 1;
            hasSubmitted = false;
            
            document.getElementById("results-area").style.display = "none";
            renderRoster();
            renderPositions();
            updateBanner();
        }

        initUI();
    </script>

</body>
</html>
