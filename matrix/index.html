<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            background-color: #0d0d0d;

            padding-top: 50px;

            max-width: 600px;

</head>
<body>

    <div class="container">
        <h1>🕹 Arcade Games Matrix</h1>
        <p>To paixnidi τρέχει κανονικά...</p>
        <!-- Edw mpainei to kyrio paixnidi sou i to canvas -->
    </div>

    <!-- Firebase App (Compat) SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <!-- Firebase Realtime Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // 1. Firebase Configuration (Vale tis dikes sou rythmiseis an xreiazetai)
        const firebaseConfig = {
            databaseURL: "EDW_TO_DATABASE_URL_THS_FIREBASE_SOU"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. To Discord Webhook URL pou exoume gia to kanali #🕹 | arcade-games
        const webhookURL = "https://discord.com/api/webhooks/1560690246893568180/RdJzCmVN_6M34J8wgQAHNlAfEpgCdKxSSp4HkHR7kumWcyvaz46YrRMpV2brDatKwGDi";

        // 3. Synartisi gia tin apostoli tou skor sto Discord meso Webhook
        function sendScoreToDiscord(playerName, score) {
            const payload = {
                content: `🕹 O paiktis **${playerName}** termatise to paixnidi me skor: **${score}**!`
            };

            fetch(webhookURL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    console.log("To apotelesma stalthike epitihos sto Discord!");
                } else {
                    console.error("Apetyxe i apostoli sto Discord.");
                }
            })
            .catch(error => console.error("Error sending to Discord:", error));
        }

        // Paradeigma xrisis: Otan o paiktis kanei save i teleionei to game, kaleis tin synartisi:
        // sendScoreToDiscord("Epspicy", 2500);
    </script>
</body>
