<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Matrix - Epspicy Arcade</title>
    <!-- Monimo Custom Favicon -->
    <link rel="icon" type="image/png" href="../logo.png">
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .game-container {
            max-width: 700px;
            width: 100%;
            background: #1a1a24;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            border: 2px solid #00ffcc;
            box-sizing: border-box;
        }
        h1 {
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        p {
            color: #8888a0;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .launch-btn {
            background-color: #ff007f;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s, transform 0.1s;
        }
        .launch-btn:hover {
            background-color: #e00070;
        }
        .launch-btn:active {
            transform: scale(0.95);
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #00ffcc;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Character Matrix</h1>
        <p>Assign characters to target GIF positions and launch your results to the community!</p>
        
        <button class="launch-btn" onclick="executeSequence()">Launch Sequence</button>
        <br>
        <a href="../" class="back-link">← Back to Arcade Hub</a>
    </div>

    <script>
        // Clean URL feature for mini-game: Initialize session and room parameters automatically
        if (!window.location.search.includes('session')) {
            const randomSession = Math.floor(1000 + Math.random() * 9000);
            const newUrl = window.location.pathname + '?session=' + randomSession + '&room=matrix-01';
            window.history.replaceState({}, '', newUrl);
        }

        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1560690246893568180/RdJzCmVN_6M34J8wgQAHNlAfEpgCdKxSSp4HkHR7kumWcyvaz46YrRMpV2brDatKwGDi";

        function executeSequence() {
            // Pairnoume ton syndedemeno xristi apo to localStorage (an exei kanei login)
            let savedUser = localStorage.getItem('discord_user');
            let playerName = "Anonymous Player";
            
            if (savedUser) {
                try {
                    let userObj = JSON.parse(savedUser);
                    if (userObj.username) playerName = userObj.username;
                } catch(e) {}
            }

            // To trexonta URL tou paixnidiou gia na to exoyn oi ypoloipoi
            const currentGameUrl = window.location.href;

            // To minima pou tha fygei sto Discord Webhook
            const discordPayload = {
                content: `🎮 **New Game Result!**\n> **Player:** ${playerName} just completed a run in **Character Matrix**!\n> 🔗 **Play here:** ${currentGameUrl}`
            };

            // Apostoli sto Discord Webhook mesw fetch
            fetch(DISCORD_WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(discordPayload)
            })
            .then(response => {
                if (response.ok) {
                    alert('Launch Successful! Your results have been posted to the Discord arcade channel!');
                } else {
                    alert('Sequence launched, but webhook notification failed.');
                }
            })
            .catch(error => {
                console.error('Webhook Error:', error);
                alert('Launch Sequence completed!');
            });
        }
    </script>

</body>
</html>
