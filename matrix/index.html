<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spicy Sequence Matrix - Epspicy Arcade</title>
    <!-- Custom Favicon -->
    <link rel="icon" type="image/png" href="../logo.png">
    <style>
        body {
            background: radial-gradient(ellipse at 50% 0%, #3a0f66 0%, #12061f 60%) fixed;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 980px;
            margin: 20px auto;
            background: #1c0b30;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            box-sizing: border-box;
            border: 2px solid #3a2a65;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-link {
            color: #a995c9;
            font-size: 14px;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.2s;
            font-weight: bold;
        }
        .back-link:hover {
            color: #19f0d4;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #160828;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #7b4dff;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .user-name {
            font-size: 14px;
            color: #ffffff;
            font-weight: bold;
        }
        .discord-btn {
            background-color: #7b4dff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            text-decoration: none;
        }
        .discord-btn:hover {
            background-color: #6a3de8;
        }
        .header-title {
            color: #19f0d4;
            font-size: 30px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: bold;
        }
        .instruction-banner {
            background: #160828;
            border: 1px solid #ff2e93;
            color: #ff2e93;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 20px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255,46,147,0.2);
        }
        .section-label {
            font-size: 15px;
            color: #19f0d4;
            text-align: left;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .char-card {
            background: #160828;
            border: 2px solid #3a2a65;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            user-select: none;
        }
        .char-card:hover:not(.used) {
            border-color: #19f0d4;
            transform: translateY(-4px);
            box-shadow: 0 0 15px rgba(25,240,212,0.3);
        }
        .char-card.used {
            opacity: 0.25;
            cursor: not-allowed;
            filter: grayscale(100%);
            border-color: #1c0b30;
        }
        .char-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #19f0d4;
            margin-bottom: 8px;
            pointer-events: none;
        }
        .char-name {
            font-size: 13px;
            color: #ffffff;
            font-weight: bold;
            pointer-events: none;
        }
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .position-slot {
            background: #160828;
            border: 2px solid #3a2a65;
            border-radius: 12px;
            padding: 10px 8px;
            transition: all 0.2s;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .position-slot.active {
            border-color: #ff2e93;
            background: #3a1040;
            box-shadow: 0 0 20px rgba(255,46,147,0.6);
            transform: scale(1.03);
        }
        .pos-assigned {
            font-size: 13px;
            color: #19f0d4;
            font-weight: bold;
            margin-bottom: 8px;
            min-height: 18px;
            pointer-events: none;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .pos-gif {
            width: 105px;
            height: 105px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid #19f0d4;
            pointer-events: none;
        }
        .action-btn {
            background-color: #ff2e93;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(255,46,147,0.4);
        }
        .action-btn:hover {
            background-color: #e0267f;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .secondary-btn {
            flex: 1;
            background: #3a2a65;
            color: #19f0d4;
            border: 1px solid #19f0d4;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 14px;
            transition: all 0.2s;
        }
        .secondary-btn:hover {
            background: #19f0d4;
            color: #12061f;
        }
        #results-area {
            margin-top: 30px;
            display: none;
            background: #160828;
            border: 1px solid #3a2a65;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
        }
        .stat-row {
            margin-bottom: 15px;
            font-size: 15px;
        }
        .stat-bar-container {
            background: #3a2a65;
            border-radius: 6px;
            height: 12px;
            width: 100%;
            margin-top: 6px;
            overflow: hidden;
        }
        .stat-bar {
            background: #ff2e93;
            height: 100%;
            border-radius: 6px;
            transition: width 0.4s ease;
        }
        .activity-feed {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #3a2a65;
        }
        .feed-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1c0b30;
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #3a2a65;
            font-size: 14px;
        }
        .feed-user {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            color: #19f0d4;
            font-size: 15px;
            min-width: 160px;
        }

            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px
