<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goon Games - Character Matcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff4757;
            margin-bottom: 5px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .roster {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .card {
            width: 100px;
            height: 120px;
            background: #2d2d2d;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            transition: 0.2s;
            text-align: center;
        }
        .card img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 5px;
        }
        .card.used {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(100%);
        }
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .slot {
            background: #252525;
            border: 2px dashed #555;
            border-radius: 8px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            position: relative;
        }
        .slot span {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background: #ff6b81;
        }
        .stats-box {
            margin-top: 20px;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Goon Games</h1>
    <p>Match characters to positions uniquely!</p>

    <div class="container">
        <!-- Roster / Available Characters -->
        <div class="roster" id="roster">
            <!-- Cards will be populated dynamically -->
        </div>

        <!-- Positions Grid -->
        <div class="positions-grid" id="positionsGrid">
            <!-- Slots will be populated dynamically -->
        </div>

        <!-- Taste Rating & Stats -->
        <div class="stats-box">
            <h3>Taste Rating: <span id="tasteRating">Neutral</span></h3>
            <p id="liveStats">Global Submissions: Loading...</p>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button onclick="resetGame()">Reset</button>
            <button onclick="shareResult()">Share</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyT85gjbKMf0RtttyECLHv2hiv1mREJtU",
            authDomain: "epspicygames.firebaseapp.com",
            databaseURL: "https://epspicygames-default-rtdb.firebaseio.com",
            projectId: "epspicygames",
            storageBucket: "epspicygames.firebasestorage.app",
            messagingSenderId: "813495756093",
            appId: "1:813495756093:web:9d0a93c37c457c653e1154",
            measurementId: "G-WHG3N8WML4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const characters = [
            { id: 'c1', name: 'Cat', img: 'hey-cat.gif' },
            { id: 'c2', name: 'Bros', img: 'hug-bros.gif' },
            { id: 'c3', name: 'Shaker', img: 'man-shaking-head-shakes-head.gif' },
            { id: 'c4', name: 'Maye', img: 'aj-brown-drake-maye-aj-brown.gif' },
            { id: 'c5', name: 'Annoyed', img: 'annoyed.gif' }
        ];

        const positions = ['Position 1', 'Position 2', 'Position 3', 'Position 4', 'Position 5'];
        let assignments = {};

        function initGame() {
            const rosterEl = document.getElementById('roster');
            const gridEl = document.getElementById('positionsGrid');
            
            rosterEl.innerHTML = '';
            gridEl.innerHTML = '';

            characters.forEach(char => {
                const card = document.createElement('div');
                card.className = `card ${Object.values(assignments).includes(char.id) ? 'used' : ''}`;
                card.innerHTML = `<img src="${char.img}" alt="${char.name}"><span>${char.name}</span>`;
                if (!Object.values(assignments).includes(char.id)) {
                    card.onclick = () => selectCharacter(char.id);
                }
                rosterEl.appendChild(card);
            });

            positions.forEach((pos, index) => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.innerHTML = `<span>${pos}</span>`;
                if (assignments[index]) {
                    const assignedChar = characters.find(c => c.id === assignments[index]);
                    slot.innerHTML += `<img src="${assignedChar.img}" style="width:70px;height:70px;object-fit:cover;border-radius:6px;"><span>${assignedChar.name}</span>`;
                    slot.onclick = () => removeAssignment(index);
                } else {
                    slot.onclick = () => assignToSlot(index);
                }
                gridEl.appendChild(slot);
            });

            updateTasteRating();
        }

        let selectedChar = null;
        window.selectCharacter = function(id) {
            selectedChar = id;
        }

        window.assignToSlot = function(index) {
            if (selectedChar) {
                assignments[index] = selectedChar;
                selectedChar = null;
                initGame();
                checkCompletion();
            }
        }

        window.removeAssignment = function(index) {
            delete assignments[index];
            initGame();
        }

        window.resetGame = function() {
            assignments = {};
            selectedChar = null;
            initGame();
        }

        function updateTasteRating() {
            const count = Object.keys(assignments).length;
            const ratings = ["Neutral", "Mild", "Spicy", "Hot", "Extreme Goon", "MAXIMUM GOON"];
            document.getElementById('tasteRating').innerText = ratings[count];
        }

        function checkCompletion() {
            if (Object.keys(assignments).length === 5) {
                push(ref(db, 'submissions'), { timestamp: Date.now() });
            }
        }

        window.shareResult = function() {
            navigator.clipboard.writeText(window.location.href);
            alert("Link copied to clipboard!");
        }

        // Live stats listener
        onValue(ref(db, 'submissions'), (snapshot) => {
            const data = snapshot.val();
            const total = data ? Object.keys(data).length : 0;
            document.getElementById('liveStats').innerText = `Global Completions: ${total}`;
        });

        initGame();
    </script>
</body>
</html>
