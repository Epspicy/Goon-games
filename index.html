<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>epspicy mini games</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 20px auto;
            background: #1a1a24;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-title {
            color: #00ffcc;
            font-size: 22px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .subtitle {
            color: #8888a0;
            font-size: 13px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Characters Roster */
        .section-label {
            font-size: 13px;
            color: #00ffcc;
            text-align: left;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        .char-card {
            background: #121218;
            border: 2px solid #2a2a3a;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .char-card:hover:not(.used) {
            border-color: #ff007f;
            transform: translateY(-3px);
        }
        .char-card.used {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(100%);
        }
        .char-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ffcc;
            margin-bottom: 6px;
        }
        .char-name {
            font-size: 13px;
            color: #ffffff;
            font-weight: bold;
        }

        /* Positions Grid */
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 25px;
        }
        .position-slot {
            background: #121218;
            border: 2px dashed #44445c;
            border-radius: 8px;
            padding: 10px 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .position-slot.active {
            border-color: #ff007f;
            background: #251221;
        }
        .pos-title {
            font-size: 11px;
            color: #8888a0;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .pos-assigned {
            font-size: 12px;
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 6px;
            min-height: 16px;
        }
        .pos-gif {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid #00ffcc;
        }

        /* Buttons */
        .action-btn {
            background-color: #ff007f;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .action-btn:hover {
            background-color: #e00070;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .secondary-btn {
            flex: 1;
            background: #2a2a3a;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
        }
        .secondary-btn:hover {
            background: #00ffcc;
            color: #0f0f13;
        }

        /* Results Area */
        #results-area {
            margin-top: 25px;
            display: none;
            background: #121218;
            border: 1px solid #2a2a3a;
            border-radius: 10px;
            padding: 20px;
            text-align: left;
        }
        .rating-badge {
            background: #00ffcc;
            color: #0f0f13;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .stat-row {
            margin-bottom: 12px;
            font-size: 13px;
        }
        .stat-bar-container {
            background: #2a2a3a;
            border-radius: 4px;
            height: 8px;
            width: 100%;
            margin-top: 4px;
            overflow: hidden;
        }
        .stat-bar {
            background: #ff007f;
            height: 100%;
            border-radius: 4px;
        }
        #toast {
            display: none;
            color: #ffcc00;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
