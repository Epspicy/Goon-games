<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>epspicy mini games</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 20px auto;
            background: #1a1a24;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-title {
            color: #00ffcc;
            font-size: 22px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .subtitle {
            color: #8888a0;
            font-size: 13px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Characters Roster (Pano Meros) */
        .section-label {
            font-size: 13px;
            color: #00ffcc;
            text-align: left;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }
        .char-card {
            background: #121218;
            border: 2px solid #2a2a3a;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .char-card:hover {
            border-color: #ff007f;
            transform: translateY(-3px);
        }
        .char-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ffcc;
            margin-bottom: 6px;
        }
        .char-name {
            font-size: 13px;
            color: #ffffff;
            font-weight: bold;
        }

        /* Positions Grid (Kato Meros) */
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 25px;
        }
        .position-slot {
            background: #121218;
            border: 2px dashed #44445c;
            border-radius: 8px;
            padding: 10px 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .position-slot.active {
            border-color: #ff007f;
            background: #251221;
        }
        .pos-title {
            font-size: 11px;
            color: #8888a0;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .pos-assigned {
            font-size: 12px;
            color: #00ffcc;
            font-weight: bold;
            word-break: break-all;
        }

        /* Action Button & Preview Box */
        .action-btn {
            background-color: #ff007f;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .action-btn:hover {
            background-color: #e00070;
        }
        #preview-area {
            margin-top: 20px;
            display: none;
        }
        #preview-gif {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            border: 2px solid #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">Epspicy Engine</div>
        <div class="subtitle">Character & Position Selection Matrix</div>

        <!-- 1. PANO MEROS: Characters Roster (I idia photo 5 fores) -->
        <div class="section-label">1. Select Character (Click to assign):</div>
        <div class="roster-grid">
            <div class="char-card" onclick="selectChar('Elena')">
                <img src="to2O1.jpg" class="char-img">
                <div class="char-name">Elena</div>
            </div>
            <div class="char-card" onclick="selectChar('Maria')">
                <img src="to2O1.jpg" class="char-img">
                <div class="char-name">Maria</div>
            </div>
            <div class="char-card" onclick="selectChar('Kostas')">
                <img src="to2O1.jpg" class="char-img">
                <div class="char-name">Kostas</div>
            </div>
            <div class="char-card" onclick="selectChar('Niki')">
                <img src="to2O1.jpg" class="char-img">
                <div class="char-name">Niki</div>
            </div>
            <div class="char-card" onclick="selectChar('Alex')">
                <img src="to2O1.jpg" class="char-img">
                <div class="char-name">Alex</div>
            </div>
        </div>

        <!-- 2. KATO MEROS: Positions Grid (Me ta 5 diaforetika GIF antistoicha) -->
        <div class="section-label">2. Target Positions (Click slot first, then pick character):</div>
        <div class="positions-grid">
            <div class="position-slot active" id="slot-1" onclick="setActiveSlot(1)">
                <div class="pos-title">Pos 1</div>
                <div class="pos-assigned" id="val-1">-</div>
