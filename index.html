<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>epspicy mini games</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #1a1a24;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 20px;
            color: #00ffcc;
            margin-bottom: 20px;
        }
        video, img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background-color: #ff007f;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e00070;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="question-title">Epelege την επόμενη κίνησή σου!</h2>
        
        <video controls autoplay loop muted id="media-element">
            <source src="-e-x-t-e-r-n-a-l_i-m-a-g-e_-v-i-d-e-o-e663a02d-a2e5-4d1a-9251-4650b879dbb2 (1).mp4" type="video/mp4">
            Ο browser δεν υποστηρίζει το βίντεο.
        </video>

        <div class="btn-container" id="buttons-area">
            <button onclick="nextScene(1)">Επιλογή A: Συνέχεια με δράση</button>
            <button onclick="nextScene(2)">Επιλογή B: Αλλαγή πορείας</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function nextScene(choice) {
            const resultDiv = document.getElementById("result");
            if (choice === 1) {
                resultDiv.innerHTML = "Επέλεξες την Επιλογή A! Συνεχίζουμε δυναμικά...";
            } else {
                resultDiv.innerHTML = "Επέλεξες την Επιλογή B! Αλλάζουμε σκηνή...";
            }
        }
    </script>

</body>
</html>
