<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goon Games - Character Matcher</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff4757;
            margin-bottom: 5px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .roster {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .card {
            width: 100px;
            height: 120px;
            background: #2d2d2d;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            transition: 0.2s;
            text-align: center;
        }
        .card:hover {
            border-color: #ff4757;
        }
        .card.selected {
            border-color: #ff4757;
            background: #3d2d2d;
        }
        .card img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 5px;
            background: #444;
        }
        .card.used {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(100%);
        }
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }
        .slot {
            background: #252525;
            border: 2px dashed #555;
            border-radius: 8px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            cursor: pointer;
            position: relative;
        }
        .slot:hover {
            border-color: #ff4757;
        }
        .slot span {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
        }
        .slot img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 5px;
        }
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background: #ff6b81;
        }
        .stats-box {
            margin-top: 20px;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Goon Games</h1>
    <p>Match characters to positions uniquely!</p>

    <div class="container">
        <!-- Positions Grid (Top) -->
        <div class="positions-grid" id="positionsGrid"></div>

        <!-- Roster / Available Characters (Bottom) -->
        <div class="roster" id="roster"></div>

        <!-- Taste Rating & Stats -->
        <div class="stats-box">
            <h3>Taste Rating: <span id="tasteRating">Neutral</span></h3>
            <p id="liveStats">Global Completions: Loading...</p>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button onclick="resetGame()">Reset</button>
            <button onclick="shareResult()">Share</button>
        </div>
    </div>

    <!-- Firebase App (Compat) & Realtime Database CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAyT85gjbKMf0RtttyECLHv2hiv1mREJtU",
            authDomain: "epspicygames.firebaseapp.com",
            databaseURL: "https://epspicygames-default-rtdb.firebaseio.com",
            projectId: "epspicygames",
            storageBucket: "epspicygames.firebasestorage.app",
            messagingSenderId: "813495756093",
            appId: "1:813495756093:web:9d0a93c37c457c653e1154",
            measurementId: "G-WHG3N8WML4"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const characters = [
            { id: 'c1', name: 'Cat', img: 'hey-cat.gif' },
            { id: 'c2', name: 'Bros', img: 'hug-bros.gif' },
            { id: 'c3', name: 'Shaker', img: 'man-shaking-head-shakes-head.gif' },
            { id: 'c4', name: 'Maye', img: 'aj-brown-drake-maye-aj-brown.gif' },
            { id: 'c5', name: 'Annoyed', img: 'annoyed.gif' }
        ];

        const positions = ['Pos 1', 'Pos 2', 'Pos 3', 'Pos 4', 'Pos 5'];
        let assignments = {};
        let selectedChar = null;
        let hasSubmitted = false;

        function initGame() {
            const rosterEl = document.getElementById('roster');
            const gridEl = document.getElementById('positionsGrid');
            
            rosterEl.innerHTML = '';
            gridEl.innerHTML = '';

            // Render Slots Grid (Top)
            positions.forEach((pos, index) => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                
                if (assignments[index]) {
                    const assignedChar = characters.find(c => c.id === assignments[index]);
                    slot.innerHTML = `
                        <span>${pos}</span>
                        <img src="${assignedChar.img}" onerror="this.src='https://via.placeholder.com/70?text=GIF'">
                        <span>${assignedChar.name}</span>
                    `;
                    slot.onclick = () => {
                        delete assignments[index];
                        hasSubmitted = false; // Reset submission lock if user changes items
                        initGame();
                    };
                } else {
                    slot.innerHTML = `<span>${pos}</span><span style="color:#666; font-size:10px; margin-top:15px;">Click to assign</span>`;
                    slot.onclick = () => {
                        if (selectedChar) {
                            assignments[index] = selectedChar;
                            selectedChar = null;
                            initGame();
                            checkCompletion();
                        }
                    };
                }
                gridEl.appendChild(slot);
            });

            // Render Roster Cards (Bottom)
            characters.forEach(char => {
                const isUsed = Object.values(assignments).includes(char.id);
                const card = document.createElement('div');
                card.className = `card ${isUsed ? 'used' : ''} ${selectedChar === char.id ? 'selected' : ''}`;
                
                card.innerHTML = `
                    <img src="${char.img}" alt="${char.name}" onerror="this.src='https://via.placeholder.com/70?text=GIF'">
                    <span>${char.name}</span>
                `;

                if (!isUsed) {
                    card.onclick = () => {
                        selectedChar = char.id;
                        initGame();
                    };
                }
                rosterEl.appendChild(card);
            });

            updateTasteRating();
        }

        window.resetGame = function() {
            assignments = {};
            selectedChar = null;
            hasSubmitted = false;
            initGame();
        }

        function updateTasteRating() {
            const count = Object.keys(assignments).length;
            const ratings = ["Neutral", "Mild", "Spicy", "Hot", "Extreme Goon", "MAXIMUM GOON"];
            document.getElementById('tasteRating').innerText = ratings[count];
        }

        function checkCompletion() {
            if (Object.keys(assignments).length === 5 && !hasSubmitted) {
                hasSubmitted = true;
                db.ref('submissions').push({ timestamp: Date.now() })
                    .then(() => {
                        console.log("Submission recorded successfully!");
                    })
                    .catch((error) => {
                        console.error("Error recording submission: ", error);
                        hasSubmitted = false;
                    });
            }
        }

        window.shareResult = function() {
            navigator.clipboard.writeText(window.location.href);
            alert("Link copied to clipboard!");
        }

        // Live stats listener from Firebase Realtime Database
        db.ref('submissions').on('value', (snapshot) => {
            const data = snapshot.val();
            const total = data ? Object.keys(data).length : 0;
            document.getElementById('liveStats').innerText = `Global Completions: ${total}`;
        });

        initGame();
    </script>
</body>
</html>
