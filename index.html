<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>epspicy mini games</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #1a1a24;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-title {
            color: #00ffcc;
            font-size: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        video, .main-media {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #2a2a3a;
        }
        
        /* Position Slots Grid */
        .section-label {
            font-size: 14px;
            color: #8888a0;
            text-align: left;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .position-card {
            background: #121218;
            border: 2px dashed #33334d;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .position-card.active {
            border-color: #00ffcc;
            background: #1e1e2d;
        }
        .position-card:hover {
            border-color: #ff007f;
        }
        .pos-title {
            font-size: 11px;
            color: #00ffcc;
            font-weight: bold;
            text-transform: uppercase;
        }
        .pos-model {
            font-size: 13px;
            color: #ffffff;
            margin-top: 5px;
            font-weight: bold;
        }

        /* Choice Buttons */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background-color: #ff007f;
            color: white;
            border: none;
            padding: 12px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        button:hover {
            background-color: #e00070;
        }
        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">Position & Model Setup</div>
        
        <video controls autoplay loop muted id="media-element">
            <source id="media-source" src="-e-x-t-e-r-n-a-l_i-m-a-g-e_-v-i-d-e-o-e663a02d-a2e5-4d1a-9251-4650b879dbb2 (1).mp4" type="video/mp4">
            Your browser does not support video.
        </video>

        <!-- Positions Layout (1 to 5) -->
        <div class="section-label">Active Positions Grid:</div>
        <div class="positions-grid">
            <div class="position-card active" onclick="selectPosition(1)">
                <div class="pos-title">Pos 1</div>
                <div class="pos-model" id="pos-1-val">Elena</div>
            </div>
            <div class="position-card" onclick="selectPosition(2)">
                <div class="pos-title">Pos 2</div>
                <div class="pos-model" id="pos-2-val">Maria</div>
            </div>
            <div class="position-card" onclick="selectPosition(3)">
                <div class="pos-title">Pos 3</div>
                <div class="pos-model" id="pos-3-val">Kostas</div>
            </div>
            <div class="position-card" onclick="selectPosition(4)">
                <div class="pos-title">Pos 4</div>
                <div class="pos-model" id="pos-4-val">Niki</div>
            </div>
            <div class="position-card" onclick="selectPosition(5)">
                <div class="pos-title">Pos 5</div>
                <div class="pos-model" id="pos-5-val">Empty</div>
            </div>
        </div>

        <!-- Dynamic Choice Actions -->
        <div class="section-label" id="action-label">Assign Model / Action for Position 1:</div>
        <div class="btn-container" id="buttons-area">
            <!-- Buttons rendered dynamically -->
        </div>
    </div>

    <script>
        let currentPos = 1;

        // Configuration for choices per position
        const positionData = {
            1: {
                label: "Select Model / Action for Position 1:",
                options: [
                    { text: "Assign Elena to Position 1", modelName: "Elena", icon: "https://via.placeholder.com/100/ff007f/ffffff?text=E" },
                    { text: "Assign Maria to Position 1", modelName: "Maria", icon: "https://via.placeholder.com/100/00ffcc/0f0f13?text=M" }
                ]
            },
            2: {
                label: "Select Model / Action for Position 2:",
                options: [
                    { text: "Assign Maria to Position 2", modelName: "Maria", icon: "https://via.placeholder.com/100/00ffcc/0f0f13?text=M" },
                    { text: "Assign Niki to Position 2", modelName: "Niki", icon: "https://via.placeholder.com/100/a800ff/ffffff?text=N" }
                ]
            },
            3: {
                label: "Select Model / Action for Position 3:",
                options: [
                    { text: "Assign Kostas to Position 3", modelName: "Kostas", icon: "https://via.placeholder.com/100/ffcc00/0f0f13?text=K" }
                ]
            },
            4: {
                label: "Select Model / Action for Position 4:",
                options: [
                    { text: "Assign Niki to Position 4", modelName: "Niki", icon: "https://via.placeholder.com/100/a800ff/ffffff?text=N" }
                ]
            },
            5: {
                label: "Select Model / Action for Position 5:",
                options: [
                    { text: "Assign Special Model to Pos 5", modelName: "Alex", icon: "https://via.placeholder.com/100/ffffff/000000?text=A" }
                ]
            }
        };

        function selectPosition(posNum) {
            currentPos = posNum;
            
            // Highlight active position card
            const cards = document.querySelectorAll('.position-card');
            cards.forEach((card, index) => {
                if (index + 1 === posNum) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });

            renderChoices(posNum);
        }

        function renderChoices(posNum) {
            const data = positionData[posNum];
            document.getElementById("action-label").innerText = data.label;
            
            const btnArea = document.getElementById("buttons-area");
            btnArea.innerHTML = "";

            data.options.forEach(opt => {
                const btn = document.createElement("button");
                btn.innerHTML = `
                    <span>${opt.text}</span>
                    <img src="${opt.icon}" class="btn-icon">
                `;
                btn.onclick = () => {
                    document.getElementById(`pos-${posNum}-val`).innerText = opt.modelName;
                };
                btnArea.appendChild(btn);
            });
        }

        // Initial Load
        window.onload = () => renderChoices(1);
    </script>

</body>
</html>
