<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>epspicy mini games</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 20px auto;
            background: #1a1a24;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-title {
            color: #00ffcc;
            font-size: 22px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .subtitle {
            color: #8888a0;
            font-size: 13px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        /* Characters Roster (Pano Meros) */
        .section-label {
            font-size: 13px;
            color: #00ffcc;
            text-align: left;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        .char-card {
            background: #121218;
            border: 2px solid #2a2a3a;
            border-radius: 10px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .char-card:hover {
            border-color: #ff007f;
            transform: translateY(-3px);
        }
        .char-img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00ffcc;
            margin-bottom: 8px;
        }
        .char-name {
            font-size: 14px;
            color: #ffffff;
            font-weight: bold;
        }

        /* Positions Grid (Kato Meros) */
        .positions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 25px;
        }
        .position-slot {
            background: #121218;
            border: 2px dashed #44445c;
            border-radius: 8px;
            padding: 12px 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .position-slot.active {
            border-color: #ff007f;
            background: #251221;
        }
        .pos-title {
            font-size: 11px;
            color: #8888a0;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .pos-assigned {
            font-size: 13px;
            color: #00ffcc;
            font-weight: bold;
        }

        /* Action Button */
        .action-btn {
            background-color: #ff007f;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .action-btn:hover {
            background-color: #e00070;
        }
        #status-msg {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">Epspicy Engine</div>
        <div class="subtitle">Character & Position Selection Matrix</div>

        <!-- 1. PANO MEROS: Characters Roster -->
        <div class="section-label">1. Select Character (Click to assign):</div>
        <div class="roster-grid">
            <div class="char-card" onclick="selectChar('Elena')">
                <img src="https://via.placeholder.com/150/ff007f/ffffff?text=Elena" class="char-img">
                <div class="char-name">Elena</div>
            </div>
            <div class="char-card" onclick="selectChar('Maria')">
                <img src="https://via.placeholder.com/150/00ffcc/0f0f13?text=Maria" class="char-img">
                <div class="char-name">Maria</div>
            </div>
            <div class="char-card" onclick="selectChar('Kostas')">
                <img src="https://via.placeholder.com/150/ffcc00/0f0f13?text=Kostas" class="char-img">
                <div class="char-name">Kostas</div>
            </div>
            <div class="char-card" onclick="selectChar('Niki')">
                <img src="https://via.placeholder.com/150/a800ff/ffffff?text=Niki" class="char-img">
                <div class="char-name">Niki</div>
            </div>
            <div class="char-card" onclick="selectChar('Alex')">
                <img src="https://via.placeholder.com/150/ffffff/0f0f13?text=Alex" class="char-img">
                <div class="char-name">Alex</div>
            </div>
        </div>

        <!-- 2. KATO MEROS: Positions Grid -->
        <div class="section-label">2. Target Positions (Click slot first, then pick character):</div>
        <div class="positions-grid">
            <div class="position-slot active" id="slot-1" onclick="setActiveSlot(1)">
                <div class="pos-title">Pos 1</div>
                <div class="pos-assigned" id="val-1">-</div>
            </div>
            <div class="position-slot" id="slot-2" onclick="setActiveSlot(2)">
                <div class="pos-title">Pos 2</div>
                <div class="pos-assigned" id="val-2">-</div>
            </div>
            <div class="position-slot" id="slot-3" onclick="setActiveSlot(3)">
                <div class="pos-title">Pos 3</div>
                <div class="pos-assigned" id="val-3">-</div>
            </div>
            <div class="position-slot" id="slot-4" onclick="setActiveSlot(4)">
                <div class="pos-title">Pos 4</div>
                <div class="pos-assigned" id="val-4">-</div>
            </div>
            <div class="position-slot" id="slot-5" onclick="setActiveSlot(5)">
                <div class="pos-title">Pos 5</div>
                <div class="pos-assigned" id="val-5">-</div>
            </div>
        </div>

        <!-- Confirm Action -->
        <button class="action-btn" onclick="executeSequence()">Launch Sequence</button>
        <div id="status-msg"></div>
    </div>

    <script>
        let currentSlot = 1;

        function setActiveSlot(slotNum) {
            currentSlot = slotNum;
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`slot-${i}`).classList.remove('active');
            }
            document.getElementById(`slot-${slotNum}`).classList.add('active');
        }

        function selectChar(charName) {
            document.getElementById(`val-${currentSlot}`).innerText = charName;
            // Αυτόματα πηγαίνει στο επόμενο διαθέσιμο slot για ευκολία
            if (currentSlot < 5) {
                setActiveSlot(currentSlot + 1);
            }
        }

        function executeSequence() {
            let p1 = document.getElementById("val-1").innerText;
            let p2 = document.getElementById("val-2").innerText;
            if(p1 === "-" && p2 === "-") {
                document.getElementById("status-msg").innerText = "Please assign characters to positions first!";
            } else {
                document.getElementById("status-msg").innerText = ">>> Sequence initiated successfully! Loading media...";
            }
        }
    </script>

</body>
</html>
