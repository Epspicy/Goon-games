<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>epspicy mini games</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #1a1a24;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .model-tag {
            background-color: #00ffcc;
            color: #0f0f13;
            display: inline-block;
            padding: 5px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        h2 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        video, img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            background-color: #ff007f;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: left;
        }
        button:hover {
            background-color: #e00070;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Edo emfanizetai to onoma tou modelou/charachter -->
        <div id="model-name" class="model-tag">Model Name</div>
        
        <!-- H erotisi h to scenario -->
        <h2 id="question-text">Loading scenario...</h2>
        
        <!-- To media (video h gif) -->
        <video controls autoplay loop muted id="media-element">
            <source id="media-source" src="" type="video/mp4">
            Your browser does not support the video.
        </video>

        <!-- Oi epiloges -->
        <div class="btn-container" id="buttons-area">
            <!-- Dynamika gemizoun apo tin JS -->
        </div>
    </div>

    <script>
        // Edo orizoume tis skines mas. Mporis na prostheteis osoes thes poly efkola!
        const scenes = {
            1: {
                model: "Model Alpha",
                text: "Model Alpha is standing by. What action should be executed?",
                media: "-e-x-t-e-r-n-a-l_i-m-a-g-e_-v-i-d-e-o-e663a02d-a2e5-4d1a-9251-4650b879dbb2 (1).mp4",
                choices: [
                    { text: "Option 1: Execute interaction with Target B", nextScene: 2 },
                    { text: "Option 2: Switch to alternative position", nextScene: 3 }
                ]
            },
            2: {
                model: "Model Alpha -> Target B",
                text: "Action executed successfully! How does the sequence continue?",
                media: "-e-x-t-e-r-n-a-l_i-m-a-g-e_-v-i-d-e-o-e663a02d-a2e5-4d1a-9251-4650b879dbb2 (1).mp4",
                choices: [
                    { text: "Back to main menu / Start over", nextScene: 1 },
                    { text: "Proceed deeper into the sequence", nextScene: 3 }
                ]
            },
            3: {
                model: "Alternative Protocol",
                text: "Alternative position active. Select final move:",
                media: "-e-x-t-e-r-n-a-g-e_-v-i-d-e-o-e663a02d-a2e5-4d1a-9251-4650b879dbb2 (1).mp4",
                choices: [
                    { text: "Restart sequence", nextScene: 1 }
                ]
            }
        };

        function loadScene(sceneId) {
            const scene = scenes[sceneId];
            if (!scene) return;

            // Enimerosi stoixeiwn
            document.getElementById("model-name").innerText = scene.model;
            document.getElementById("question-text").innerText = scene.text;
            
            // Allagi video/media (an theleis na bazeis diaforetiko arxeio ana skini, apla to allazeis sto JSON)
            const videoElement = document.getElementById("media-element");
            const sourceElement = document.getElementById("media-source");
            sourceElement.src = scene.media;
            videoElement.load();

            // Dimiourgia koupion dynamika
            const buttonsArea = document.getElementById("buttons-area");
            buttonsArea.innerHTML = ""; // Katharisma proigoumenon koupion

            scene.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.innerText = choice.text;
                btn.onclick = () => loadScene(choice.nextScene);
                buttonsArea.appendChild(btn);
            });
        }

        // Fortosi tis prwtis skinis otan anoigei i selida
        window.onload = () => loadScene(1);
    </script>

</body>
</html>
