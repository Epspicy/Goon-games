<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>epspicy mini games</title>
    <style>
        body {
            background-color: #050508;
            color: #00ffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 550px;
            margin: 40px auto;
            background: #0d0d14;
            border: 2px solid #ff2200;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(255, 34, 0, 0.4), 0 0 15px rgba(0, 255, 255, 0.3);
        }
        h2 {
            font-size: 22px;
            color: #ffcc00;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.6);
        }
        video, img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            background-color: #1a0033;
            color: #ff0055;
            border: 2px solid #ff0055;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        button:hover {
            background-color: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
        }
        #result {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #00ff66;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="question-title">System Ready: Choose Your Path</h2>
        
        <video controls autoplay loop muted id="media-element">
            <source src="-e-x-t-e-r-n-a-l_i-m-a-g-e_-v-i-d-e-o-e663a02d-a2e5-4d1a-9251-4650b879dbb2 (1).mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="btn-container" id="buttons-area">
            <button onclick="nextScene(1)">Option Alpha: Proceed to Action</button>
            <button onclick="nextScene(2)">Option Beta: Switch Protocol</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        function nextScene(choice) {
            const resultDiv = document.getElementById("result");
            if (choice === 1) {
                resultDiv.innerHTML = ">>> Alpha path selected. Loading next phase...";
            } else {
                resultDiv.innerHTML = ">>> Beta path selected. Re-routing sequence...";
            }
        }
    </script>

</body>
</html>
